a de desarrollo MVP con base en Miami que trabaja con fundadores y operadores en EE. UU. y en todo el mundo. MVPs a medida en 14 días, código tuyo el Día 14.\"},\"header\":{\"phoneLabel\":\"Llámanos\",\"ctaShort\":\"Reservar llamada\"},\"hero\":{\"eyebrow\":\"Software · MVP en 14 días\",\"headline\":\"De la idea al producto en vivo en\",\"headlineHighlight\":\"14 días\",\"lead\":\"Precio fijo. Construido por el fundador que escaló Taptok a más de 15,000 clientes en 75+ países. Dos semanas del brief al producto en vivo. El código es tuyo el Día 14\",\"primaryCta\":\"Reservar mi llamada\",\"secondaryCta\":\"Ver el plan de 14 días\",\"priceStripLabel\":\"PRECIO DE LANZAMIENTO · 50% OFF\",\"priceStripSuffix\":\"2 de 4 plazas restantes este mes\",\"trustNote\":\"Con la confianza de fundadores, operadores y equipos enterprise que lanzan software real.\"},\"video\":{\"eyebrow\":\"Cómo trabajamos\",\"title\":\"Producto real en dos semanas.\",\"blurb\":\"Un recorrido de 15 segundos del ciclo brief → spec → construcción → lanzamiento que usamos en cada proyecto.\",\"pendingNotice\":\"Video promocional próximamente.\"},\"trust\":{\"statShipped\":\"15,000+\",\"statShippedLabel\":\"Usuarios en productos lanzados\",\"statRating\":\"4.9★\",\"statRatingLabel\":\"Valoración de fundadores\",\"statSpeed\":\"Miami\",\"statSpeedLabel\":\"Agencia con base en Miami\"},\"outcomes\":{\"eyebrow\":\"El día 14, tienes un producto en vivo.\",\"title\":\"Sin demos — un producto real en producción.\",\"cards\":[{\"title\":\"Producto en vivo, con tu marca\",\"body\":\"Desplegado en tu propia infraestructura (Vercel, App Store, Play Store) bajo tu dominio. Usuarios reales pueden registrarse, pagar y usarlo el día del lanzamiento.\"},{\"title\":\"Código fuente y handover completo\",\"body\":\"Repo de GitHub transferido a tu cuenta el Día 14 con historial de commits, docs de entorno y recorrido del admin. Tu equipo — o cualquier agencia — puede tomarlo limpio.\"},{\"title\":\"Llamadas semanales\",\"body\":\"Tres llamadas programadas durante la construcción (Día 2 lock del spec, Día 7 revisión intermedia, Día 14 lanzamiento). Sin entregas silenciosas ni facturas sorpresa.\"}]},\"howItWorks\":{\"eyebrow\":\"El ciclo de 14 días\",\"title\":\"Producto Listo en 14 Días\",\"steps\":[{\"day\":\"Día 1\",\"title\":\"Brief\",\"body\":\"Llamada de 60 minutos para fijar el objetivo, la audiencia y el evento de conversión que el MVP debe lograr.\"},{\"day\":\"Día 2-3\",\"title\":\"Spec\",\"body\":\"Wireframes, modelo de datos, integraciones y una hoja de alcance fijo que apruebas antes de escribir código.\"},{\"day\":\"Día 4-12\",\"title\":\"Construcción\",\"body\":\"Commits diarios, updates async y un staging URL que puedes revisar cuando quieras. Revisión intermedia en el día 7.\"},{\"day\":\"Día 13-14\",\"title\":\"Lanzamiento\",\"body\":\"Despliegue a producción, entrega de credenciales y docs, y recorrido del admin para que lo manejes el día 15.\"}]},\"portfolio\":{\"eyebrow\":\"Trabajo real lanzado\",\"title\":\"Productos que hemos construido y lanzado\",\"subtitle\":null,\"cards\":[{\"client\":\"Taptok\",\"tagline\":\"SaaS de tarjetas digitales y networking\",\"description\":\"Plataforma multi-tenant con tap-to-share NFC, networking QR y scoring de leads con IA. Escalado a más de 15,000 clientes en 75+ países. Clientes enterprise incluyen Authentic Brands Group, Banesco y la Ciudad de Coral Gables.\",\"imageSlug\":\"taptok\"},{\"client\":\"Apex One Inspection Pro\",\"tagline\":\"App de campo para inspectores\",\"description\":\"Herramienta móvil y web para inspectores residenciales que captura cada habitación, defecto y foto en el sitio. Genera un reporte PDF con marca antes de que el inspector salga. Reduce horas de papeleo post-visita a cero.\",\"imageSlug\":\"apex\"},{\"client\":\"SoldTools\",\"tagline\":\"Plataforma de inteligencia de ventas para concesionarios\",\"description\":\"Captura de leads, agenda de citas e inteligencia de cierres diseñada para consultores de ventas automotrices. Incluye un motor de referidos que convierte clientes pasados en un pipeline repetible. Pensada para reemplazar el flujo de cuaderno e hilos de texto con el que la mayoría de los reps en piso trabajan.\",\"imageSlug\":\"soldtools\"}]},\"founder\":{\"eyebrow\":\"Construido por un operador, no por un contratista.\",\"title\":\"Hablarás con quien toma las decisiones del build.\",\"paragraphs\":[\"Soy Janse Lazo. Antes de Zenpho, co-fundé Taptok — un B2B SaaS que escaló a más de 15,000 clientes en 75+ países, con clientes enterprise como Authentic Brands Group, Banesco, Kodiak Gas, Consolidated Electric Group y la Ciudad de Coral Gables.\",\"Años dirigiendo producto, soporte y growth como un solo sistema me enseñaron qué realmente se lanza y qué no. Zenpho es cómo llevo ese ritmo de operador a otros fundadores.\",\"Cada proyecto en esta página, yo personalmente lo defino, construyo y reviso. Si trabajamos juntos, hablas conmigo — no con un account manager a tres zonas horarias del código.\"],\"signatureLine\":\"Janse Lazo · Fundador e Ingeniero de Software, Zenpho\",\"photoAlt\":\"Janse Lazo, fundador de Zenpho\",\"linkedinLabel\":\"Conectar en LinkedIn\",\"linkedinUrl\":\"https://www.linkedin.com/in/janselazo/\"},\"pricing\":{\"eyebrow\":\"Oferta de lanzamiento limitada\",\"title\":\"Tu MVP a medida, lanzado en 14 días.\",\"priceOriginal\":5000,\"priceLive\":2500,\"priceCurrencyDisplay\":\"$$\",\"priceCurrencySuffix\":\" USD\",\"saveBadgeTemplate\":\"AHORRA {pct}%\",\"saveBadgeLabel\":\"Ahorra 50% — precio de lanzamiento limitado\",\"launchRibbon\":\"PRECIO DE LANZAMIENTO · 50% OFF\",\"whyLaunchHeading\":\"¿Por qué el precio de lanzamiento?\",\"whyLaunchBody\":\"Estamos construyendo nuestra biblioteca pública de casos de estudio durante 2026. Mientras tanto, obtienes el mismo build liderado por un operador a la mitad de la tarifa estándar. Cuando se llenen las plazas, el precio vuelve a $5,000.\",\"priceCaption\":\"Pago único, alcance fijo. Sin facturación por hora, sin retainers, sin sorpresas.\",\"inclusionsHeading\":\"Qué incluye:\",\"notIncludedHeading\":\"No incluye:\",\"inclusions\":[\"Discovery + spec del producto (Día 1-2)\",\"Diseño UI/UX a medida según tu marca\",\"Construcción full-stack (Next.js / React Native / Postgres / Stripe según alcance)\",\"Hasta 4 pantallas o superficies principales\",\"Autenticación, pagos o integraciones core según alcance\",\"Despliegue en tus cuentas de Vercel / App Store / Play Store\",\"Código fuente, documentación y handover del admin\",\"14 días de soporte post-lanzamiento\"],\"exclusionsNote\":\"Retainer continuo, gestión de pauta paga o cambios de alcance fuera del spec cerrado el Día 2. Esos se cotizan por separado en la llamada.\",\"cta\":\"Reclamar mi build con 50% de descuento\",\"trustRow\":\"Precio fijo · Código tuyo · 14 días de soporte · 50% al inicio, 50% al lanzar\"},\"whoFor\":{\"eyebrow\":\"Encaje correcto\",\"title\":\"Para constructores, no para curiosos.\",\"forHeading\":\"Esto es para ti si…\",\"forItems\":[\"Eres un fundador lanzando v1 de un producto real, no un side project\",\"Eres un negocio reemplazando un proceso manual (hojas de cálculo, papel, herramientas dispersas) con software\",\"Eres una agencia que necesita capacidad extra para un proyecto puntual\",\"Puedes tomar decisiones en menos de 24 horas — el ciclo de 14 días depende de eso\"],\"notForHeading\":\"Probablemente no es para ti si…\",\"notForItems\":[\"Buscas un build tipo plantilla de $500\",\"Quieres un rewrite enterprise multi-año con comités semanales\",\"Aún no tienes claro cuál es el único evento de conversión que el MVP debe lograr\",\"Necesitas desarrollo continuo mes tras mes — nosotros lanzamos y entregamos\"]},\"riskReversal\":{\"eyebrow\":\"Construido alrededor de tu riesgo\",\"title\":\"Cuatro garantías antes de tocar el código.\",\"points\":[{\"title\":\"Precio fijo, alcance cerrado\",\"body\":\"$$2,500 USD es el precio total por el alcance acordado el Día 2. Sin sorpresas por hora ni change orders sin tu aprobación.\"},{\"title\":\"El código es tuyo el Día 14\",\"body\":\"Repo de GitHub transferido a tu cuenta con historial completo, docs de entorno y recorrido del admin.\"},{\"title\":\"Tres llamadas — nunca silenciosos\",\"body\":\"Día 2 lock del spec, Día 7 revisión intermedia, Día 14 lanzamiento. Siempre sabes en qué punto está el build.\"},{\"title\":\"14 días de soporte post-lanzamiento\",\"body\":\"Si algo se rompe en las primeras dos semanas en producción, lo arreglamos sin costo.\"}]},\"testimonials\":{\"eyebrow\":\"Productos que los clientes aman\",\"title\":\"Lo que dicen los fundadores después de lanzar.\",\"items\":[{\"quote\":\"Teníamos dos semanas para validar el producto. Lo lanzaron en doce días, al precio que cotizaron, y el producto sigue en producción un año después.\",\"author\":\"Fundador\",\"role\":\"Apex One Inspection Pro\"},{\"quote\":\"Zenpho nos ayudó a construir las apps web y móviles a medida detrás de Taptok — hoy el producto atiende a más de 15,000 clientes.\",\"author\":\"Ronald Sunderland\",\"role\":\"CTO · Taptok\"},{\"quote\":\"Captura de leads, agenda e inteligencia de cierres por fin en un solo lugar — no otro CRM encima del flujo de hojas de cálculo e hilos de texto con el que nuestros reps en piso estaban atrapados.\",\"author\":\"Fundador\",\"role\":\"SoldTools\"},{\"quote\":\"Zenpho no solo reconstruyó nuestra tienda — reconstruyó cómo los clientes viven la marca. Las suscripciones pagaron el proyecto en once semanas.\",\"author\":\"Fundador\",\"role\":\"TQMuch\"}]},\"faq\":{\"eyebrow\":\"FAQ\",\"title\":\"Todo lo que los fundadores preguntan antes de la llamada.\",\"items\":[{\"q\":\"¿Cómo construyen un producto real en 14 días?\",\"a\":\"No reinventamos la rueda en cada proyecto. Auth, pagos, design system, hosting, observabilidad — es tooling pre-construido que llevamos entre proyectos. Lo que construimos nuevo es lo tuyo: el modelo de datos, los flujos, la UI y el evento de conversión. Dos semanas alcanzan cuando el spec se cierra el Día 2 y las decisiones llegan en menos de 24 horas.\"},{\"q\":\"¿Qué pasa si necesito cambios de alcance durante la construcción?\",\"a\":\"El spec del Día 2 es el contrato. Dentro de ese alcance, $2,500 es el precio total. Todo lo demás se cotiza antes de tocarlo — tú decides si agregarlo ahora, después del lanzamiento o omitirlo. Sin facturas sorpresa.\"},{\"q\":\"¿Qué stack tecnológico usan?\",\"a\":\"Next.js o React Native en el front, Postgres + Supabase o Prisma en datos, Stripe para pagos, Vercel para hosting. El stack se elige según tu caso, pero siempre es estándar, documentado y fácil de retomar el Día 15.\"},{\"q\":\"¿Cómo se estructura el pago?\",\"a\":\"50% el Día 1 para reservar tu lugar e iniciar discovery. 50% el Día 14 cuando el producto está en vivo en tu entorno. Sin facturación por hora ni retainer.\"},{\"q\":\"¿Qué pasa después del Día 14?\",\"a\":\"Eres dueño del código, el despliegue y la documentación. Los 14 días de soporte cubren fallos en producción sin cargo. Después puedes manejarlo solo, contratar a alguien para extenderlo o volver con nosotros con un nuevo alcance cotizado.\"},{\"q\":\"¿Firman NDA?\",\"a\":\"Sí. Envía el tuyo antes de la llamada o usa el nuestro. NDA mutuo estándar.\"},{\"q\":\"¿Por qué el precio es tan bajo?\",\"a\":\"Estamos construyendo nuestra biblioteca pública de casos de estudio durante 2026. Mientras tanto, obtienes el mismo build liderado por un operador a la mitad de la tarifa estándar. Cuando se llenen las plazas, el precio vuelve a $5,000.\"}]},\"conversion\":{\"sectionEyebrow\":\"Empieza aquí\",\"sectionTitle\":\"Mira si el build de 14 días es para ti.\",\"sectionLead\":\"Dos preguntas rápidas, luego eliges hora en el calendario. Dos minutos en total. En la llamada sabrás si encajamos.\",\"progressLabel\":\"Paso\",\"progressOf\":\"de\",\"nextLabel\":\"Siguiente\",\"backLabel\":\"Atrás\",\"detailsTitle\":\"Tus datos\",\"detailsLead\":\"Para confi
