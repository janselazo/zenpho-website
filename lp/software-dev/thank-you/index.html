rldwide. Custom MVPs shipped in 14 days, source code yours on Day 14.\"},\"header\":{\"phoneLabel\":\"Call us\",\"ctaShort\":\"Book the call\"},\"hero\":{\"eyebrow\":\"Software · 14-day MVP build\",\"headline\":\"From idea to live product in\",\"headlineHighlight\":\"14 days\",\"lead\":\"Fixed price. Built by the founder who scaled Taptok to 15,000+ customers across 75+ countries. Two weeks from brief to live product. You own the code on Day 14\",\"primaryCta\":\"Book the discovery call\",\"secondaryCta\":\"See the 14-day plan\",\"priceStripLabel\":\"LAUNCH PRICING · 50% OFF\",\"priceStripSuffix\":\"2 of 4 spots left this month\",\"trustNote\":\"Trusted by founders, operators, and enterprise teams shipping real software.\"},\"video\":{\"eyebrow\":\"How we work\",\"title\":\"Real product in two weeks.\",\"blurb\":\"A 15-second walkthrough of the brief → spec → build → launch cadence we run on every project.\",\"pendingNotice\":\"Promo video loading soon.\"},\"trust\":{\"statShipped\":\"15,000+\",\"statShippedLabel\":\"Users on shipped products\",\"statRating\":\"4.9★\",\"statRatingLabel\":\"Founder rating\",\"statSpeed\":\"Miami\",\"statSpeedLabel\":\"Miami-based agency\"},\"outcomes\":{\"eyebrow\":\"Day 14, you own a live product.\",\"title\":\"No demos — a real product in production.\",\"cards\":[{\"title\":\"Live, branded product\",\"body\":\"Deployed to your own infrastructure (Vercel, App Store, Play Store) under your domain. Real users can sign up, pay, and use it the day you launch.\"},{\"title\":\"Source code \u0026 full handover\",\"body\":\"GitHub repo transferred to your account on Day 14 with commit history, environment docs, and an admin walkthrough. Your team — or any agency — can pick it up cleanly.\"},{\"title\":\"Weekly working sessions\",\"body\":\"Three scheduled calls during the build (Day 2 spec lock, Day 7 mid-build review, Day 14 launch). No silent hand-offs, no surprise invoices.\"}]},\"howItWorks\":{\"eyebrow\":\"The 14-day cadence\",\"title\":\"Four steps. One working product. Two weeks.\",\"steps\":[{\"day\":\"Day 1\",\"title\":\"Brief\",\"body\":\"60-minute call to lock the goal, the audience, and the single conversion event your MVP has to deliver.\"},{\"day\":\"Day 2-3\",\"title\":\"Spec\",\"body\":\"Wireframes, data model, integrations, and a fixed-scope build sheet you approve before any code is written.\"},{\"day\":\"Day 4-12\",\"title\":\"Build\",\"body\":\"Daily commits, async updates, and a staging URL you can poke at any time. Mid-build review on Day 7.\"},{\"day\":\"Day 13-14\",\"title\":\"Launch\",\"body\":\"Deploy to production, hand over credentials and docs, and walk through the admin so you can run it solo on Day 15.\"}]},\"portfolio\":{\"eyebrow\":\"Real shipped work\",\"title\":\"Products we have built, and launched\",\"subtitle\":null,\"cards\":[{\"client\":\"Taptok\",\"tagline\":\"Digital business card \u0026 networking SaaS\",\"description\":\"Multi-tenant platform with NFC tap-to-share, QR networking, and AI lead scoring. Scaled to 15,000+ customers across 75+ countries. Enterprise clients include Authentic Brands Group, Banesco, and the City of Coral Gables.\",\"imageSlug\":\"taptok\"},{\"client\":\"Apex One Inspection Pro\",\"tagline\":\"Home inspection field app\",\"description\":\"Mobile and web tool for residential inspectors that captures every room, defect, and photo on-site. Ships a fully branded PDF report before the inspector leaves the driveway. Cuts hours of post-visit paperwork down to zero.\",\"imageSlug\":\"apex\"},{\"client\":\"SoldTools\",\"tagline\":\"Sales intelligence platform for car dealers\",\"description\":\"Lead capture, appointment scheduling, and deal intelligence built for automotive sales consultants. Includes a referral engine that turns past customers into a repeatable pipeline. Designed to replace the notebook-and-text-thread workflow most floor reps run on.\",\"imageSlug\":\"soldtools\"}]},\"founder\":{\"eyebrow\":\"Built by an operator, not a contractor.\",\"title\":\"You'll talk to the person making the build decisions.\",\"paragraphs\":[\"I'm Janse Lazo. Before Zenpho, I co-founded Taptok — a B2B SaaS that scaled to 15,000+ customers across 75+ countries, with enterprise clients including Authentic Brands Group, Banesco, Kodiak Gas, Consolidated Electric Group, and the City of Coral Gables.\",\"Years of running product, support, and growth as a single system taught me what actually ships and what doesn't. Zenpho is how I bring that operator-led cadence to other founders.\",\"Every project on this page, I personally scope, build, and review. If we work together, you talk to me — not an account manager three time-zones from the code.\"],\"signatureLine\":\"Janse Lazo · Founder \u0026 Software Engineer, Zenpho\",\"photoAlt\":\"Janse Lazo, founder of Zenpho\",\"linkedinLabel\":\"Connect on LinkedIn\",\"linkedinUrl\":\"https://www.linkedin.com/in/janselazo/\"},\"pricing\":{\"eyebrow\":\"Limited launch offer\",\"title\":\"Your custom MVP, shipped in 14 days.\",\"priceOriginal\":5000,\"priceLive\":2500,\"priceCurrencyDisplay\":\"$$\",\"priceCurrencySuffix\":\" USD\",\"saveBadgeTemplate\":\"SAVE {pct}%\",\"saveBadgeLabel\":\"Save 50% — limited launch pricing\",\"launchRibbon\":\"LAUNCH PRICING · 50% OFF\",\"whyLaunchHeading\":\"Why the launch price?\",\"whyLaunchBody\":\"We're building our public case study library through 2026. While we are, you get the same operator-led build at half the standard rate. When the launch slots fill, pricing returns to $5,000.\",\"priceCaption\":\"One-time, fixed scope. No hourly billing, no retainers, no surprises.\",\"inclusionsHeading\":\"What's included:\",\"notIncludedHeading\":\"Not included:\",\"inclusions\":[\"Discovery + product spec (Day 1-2)\",\"Custom UI/UX designed to your brand\",\"Full-stack build (Next.js / React Native / Postgres / Stripe as scoped)\",\"Up to 4 core screens or app surfaces\",\"Authentication, payments, or core integrations as scoped\",\"Deployment to your Vercel / App Store / Play Store accounts\",\"Source code, documentation, and admin handover\",\"14-day post-launch support window\"],\"exclusionsNote\":\"Ongoing retainer, paid ad management, or scope changes beyond the locked Day-2 spec. Those are quoted separately on the call.\",\"cta\":\"Claim my 50% off build\",\"trustRow\":\"Fixed price · Code is yours · 14-day support · 50% to start, 50% at launch\"},\"whoFor\":{\"eyebrow\":\"Right fit\",\"title\":\"Built for builders, not browsers.\",\"forHeading\":\"This is for you if…\",\"forItems\":[\"You are a founder shipping v1 of a real product, not a side project\",\"You are a business replacing a manual process (spreadsheets, paper, scattered tools) with software\",\"You are an agency that needs extra build capacity for one engagement\",\"You can make decisions inside 24 hours — the 14-day cadence depends on it\"],\"notForHeading\":\"Probably not for you if…\",\"notForItems\":[\"You are shopping for a $500 template build\",\"You want a multi-year enterprise rewrite with weekly steering committees\",\"You don't have a clear single conversion event the MVP must deliver yet\",\"You need ongoing dev work month after month — we ship and hand off\"]},\"riskReversal\":{\"eyebrow\":\"Built around your risk\",\"title\":\"Four guarantees before we touch the code.\",\"points\":[{\"title\":\"Fixed price, locked scope\",\"body\":\"$$2,500 is the all-in price for the scope agreed on Day 2. No hourly surprises, no change orders without your signoff.\"},{\"title\":\"Code is yours on Day 14\",\"body\":\"GitHub repo transferred to your account with full commit history, environment docs, and admin walkthrough.\"},{\"title\":\"Three working calls — never silent\",\"body\":\"Day 2 spec lock, Day 7 mid-build review, Day 14 launch. You always know where the build stands.\"},{\"title\":\"14-day post-launch support\",\"body\":\"If something breaks in the first two weeks of production, we fix it at no charge.\"}]},\"testimonials\":{\"eyebrow\":\"Built products customers love\",\"title\":\"What founders say after shipping.\",\"items\":[{\"quote\":\"We had two weeks to validate the product. They shipped in twelve days, on the price they quoted, and the product is still in production a year later.\",\"author\":\"Founder\",\"role\":\"Apex One Inspection Pro\"},{\"quote\":\"Zenpho helped us build the custom web and mobile apps behind Taptok — the product now serves more than 15,000 customers.\",\"author\":\"Ronald Sunderland\",\"role\":\"CTO · Taptok\"},{\"quote\":\"Lead capture, scheduling, and deal intelligence finally live in one place — not another CRM bolted onto the spreadsheet-and-group-chat workflow our floor reps were stuck in.\",\"author\":\"Founder\",\"role\":\"SoldTools\"},{\"quote\":\"Zenpho didn't just rebuild our store — they rebuilt how customers experience the brand. Subscriptions paid back the project in eleven weeks.\",\"author\":\"Founder\",\"role\":\"TQMuch\"}]},\"faq\":{\"eyebrow\":\"FAQ\",\"title\":\"Everything founders ask before the call.\",\"items\":[{\"q\":\"How can you actually build a real product in 14 days?\",\"a\":\"We don't reinvent the wheel on every project. Auth, payments, design system, hosting, observability — that's pre-built tooling we carry between projects. What we build new is the part that's yours: the data model, the flows, the UI, and the conversion event. Two weeks is enough for that scope when the spec is locked on Day 2 and decisions stay inside 24 hours.\"},{\"q\":\"What if I need scope changes mid-build?\",\"a\":\"The Day-2 spec is the contract. Inside that scope, $2,500 is the all-in price. Anything outside it gets quoted before we touch it — your call whether to add it now, after launch, or skip it. No surprise invoices either way.\"},{\"q\":\"What tech stack do you use?\",\"a\":\"Next.js or React Native on the front end, Postgres + Supabase or Prisma on the data layer, Stripe for payments, Vercel for hosting. The stack is chosen for your use case, but the constant is: standard, well-documented, and easy for any other developer to pick up on Day 15.\"},{\"q\":\"How is payment structured?\",\"a\":\"50% on Day 1 to lock your slot and start discovery. 50% on Day 14 when the product is live in your environment. No hourly billing, no retainer.\"},{\"q\":\"What happens after Day 14?\",\"a\":\"You own the code, the deployment, and the documentation. The 14-day support window covers production breakage at no charge. After that, you can run it solo, hire someone to extend it, or come back to us for a new scope on a quoted basis.\"},{\"q\":\"Do you sign an NDA?\",\"a\":\"Yes. Send yours before the discovery call or use ours. Standard mutual NDA either way.\"},{\"q\":\"Why is the price this low?\",\"a\":\"We're building our public case study library through 2026. While we are, you get the same operator-led build at half the standard rate. When the launch slots fill, pricing returns to $5,000 — and climbs from there as the case studies stack.\"}]},\"conversion\":{\"sectionEyebrow\":\"Start here\",\"sectionTitle\":\"See if the 14-day build is right for you.\",\"sectionLead\":\"Two quick questions, then pick a time on the calendar. Two minutes total. You'll know on the call whether we're a fit.\",\"progressLabel\":\"Step\",\"progressOf\":\"of\",\"nextLabel\":\"Next\",\"backLabel\":\"Back\",\"detailsTitle\":\"Your details\",\"detailsLead\":\"So we can confirm the call and send your calendar invite.\",\"nameLabel\":\"Your name\",\"namePlaceholder\":\"Jane Doe\",\"emailLabel\":\"Email\",\"emailPlaceholder\":\"jane@brand.com\",\"phoneLabel\":\"Phone\",\"phonePlaceholder\":\"(786) 555-0123\",\"companyLabel\":\"Company\",\"companyPlaceholder\":\"Brand Co.\",\"submitDetailsLabel\":\"Continue to calendar\",\"pickTimeTitle\":\"Pick a time.\",\"pickTimeLead\":\"30-minute discovery call. We confirm timezone + invite within 24h.\",\"bookButton\":\"Book the call\",\"booking\":\"Booking…\",\"requiredError\":\"Please share your name, email, and phone so we can confirm the call.\",\"genericError\":\"Something went wrong. Please try again.\",\"selectedPrefix\":\"Selected\",\"survey\":[{\"id\":\"product_type\",\"prompt\":\"What are you building?\",\"options\":[{\"value\":\"A web app / SaaS MVP\",\"label\":\"Web app / SaaS MVP\"},{\"value\":\"A mobile app\",\"label\":\"Mobile app\"},{\"value\":\"A custom website\",\"label\":\"Professional website / ecommerce store\"},{\"value\":\"Internal tool\",\"label\":\"Internal tool / dashboard\"},{\"value\":\"Something else\",\"label\":\"Not sure yet\"}]},{\"id\":\"start_timeline\",\"prompt\":\"When do you want to start?\",\"options\":[{\"value\":\"This week\",\"label\":\"This week\"},{\"value\":\"Within 30 days\",\"label\":\"Within 30 days\"},{\"value\":\"Within 90 days\",\"label\":\"Within 90 days\"},{\"value\":\"Just exploring\",\"label\":\"Just exploring\"}]}]},\"thankYou\":{\"eyebrow\":\"Booked\",\"title\":\"Received with grace.\",\"lead\":\"You are booked. A calendar invite with the meeting link will follow within 24 hours.\",\"next\":\"What happens next: on the call we walk through your goal, agree on the scope we'd lock on Day 2, and confirm timing. If we are a fit, we send the 50% deposit invoice the same day.\",\"addToCalendar\":\"Add to calendar\",\"referHeading\":\"Know a founder who needs this?\",\"referBody\":\"Forward this page — same 14-day cadence, same launch offer.\",\"backHome\":\"Back to zenpho.com\"},\"footer\":{\"copyright\":\"© Zenpho · The Renaissance of Software · Miami, FL\",\"linkedinLabel\":\"LinkedIn\",\"privacy\":\"Privacy\",\"terms\":\"Terms\",\"altLocaleNote\":\"Versión en español\"},\"switcher\":{\"enLabel\":\"EN\",\"esLabel\":\"ES\",\"enAria\":\"Switch to English\",\"esAria\":\"Switch to Spanish\"}},\"locale\":\"en\"}]],[\"$L14\"],\"$L15\"]}]\n"])</script><script>self.__next_f.push([1,"16:[]\nd:\"$W16\"\ne:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L17\",null,{\"children\":\"$L18\"}],[\"$\",\"div\",null,{\"hidden\":true,\
